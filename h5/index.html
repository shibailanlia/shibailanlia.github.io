<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>智慧校园移动端</title>
<!-- iOS 添加到主屏幕 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="智慧校园">
<meta name="theme-color" content="#861932">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="icon" href="../assets/apple-touch-icon.png">
<style>
  :root{
    --primary:#aa0000;
    --primary-dark:#840911;
    --pink-text:#ab425c;
    --blue:#2f6fe0;
    --gold1:#fffbf5;
    --gold2:#ffc999;
    --tabbar-h:54px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system-font,"Helvetica Neue",Helvetica,sans-serif;
    background:#e9e9ee;
    display:flex;justify-content:center;
    color:#000;
  }
  /* 手机外壳 */
  #phone{
    position:relative;
    width:100%;max-width:none;
    flex:0 0 auto;
    height:100vh;
    height:100dvh;
    height:calc(var(--vh,1vh) * 100);
    background:#fff;
    overflow:hidden;
    box-shadow:0 0 24px rgba(0,0,0,.18);
  }
  /* 页面滚动容器 */
  #viewport{
    position:absolute;top:0;left:0;right:0;bottom:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:#fafafa url("../assets/mobileHeader.png") no-repeat top center;
    background-size:cover;
  }
  #viewport.no-tabbar{bottom:0;}
  #page{padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom));min-height:100%;}
  #page.pad0{padding-bottom:0;}

  /* ========== 通用顶部 ========== */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 18px 8px;
  }
  .topbar .title{
    font-size:26px;font-weight:700;font-style:italic;
    background:linear-gradient(180deg,var(--gold1),var(--gold2));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    letter-spacing:2px;
  }
  .topbar .sub{
    font-size:15px;
    background:linear-gradient(180deg,var(--gold1),var(--gold2));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    letter-spacing:1px;
  }
  .topbar .logo{width:58px;height:58px;}
  .topbar .setting{font-size:24px;color:#2f6fe0;display:flex;align-items:center;}
  .topbar .setting svg{width:26px;height:26px;}

  /* ========== 首页（照抄真实站 rem 原值；根字号 = 视口宽/375*16） ========== */
  .home{
    background-image:url("../assets/mobileHeader.png");
    background-size:cover;background-repeat:no-repeat;
    padding:.9375rem;
    padding-top:calc(.9375rem + env(safe-area-inset-top));
    min-height:100vh;min-height:100dvh;
    box-sizing:border-box;
    position:relative;
    margin-bottom:calc(var(--tabbar-h) * -1 - env(safe-area-inset-bottom));
    padding-bottom:calc(.9375rem + var(--tabbar-h) + env(safe-area-inset-bottom));
  }
  .home .header{display:flex;}
  .header-left-name{
    flex:1;min-width:0;
    background-image:linear-gradient(180deg,#fffbf5,#ffc999);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;text-fill-color:transparent;
    letter-spacing:.25rem;
  }
  .header-left-name h5{
    margin-right:.875rem;
    font-size:1.25rem;font-style:italic;white-space:nowrap;
    background-image:linear-gradient(180deg,#fffbf5,#ffc999);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;text-fill-color:transparent;
    margin-bottom:.375rem;
  }
  .header-left-name p{padding-top:.3125rem;font-size:1rem;line-height:1.15;margin-right:.875rem;}
  .header-right{flex:0 0 33.33%;text-align:right;}
  .header-right img{width:3.75rem;height:3.75rem;margin-right:.625rem;}

  .header-carousel{margin-top:.9375rem;height:150px;}
  .header-carousel-view{
    white-space:nowrap;width:100%;
    overflow-x:auto;scroll-snap-type:x mandatory;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .header-carousel-view::-webkit-scrollbar{display:none;}
  .header-carousel-item{border-radius:.9375rem;display:inline-block;height:150px;width:100%;scroll-snap-align:start;vertical-align:top;}
  .header-carousel-img{border-radius:.9375rem;height:150px;width:100%;object-fit:cover;display:block;}

  .top-nav{margin-top:.625rem;}
  .top-nav .roll-news{
    display:flex;align-items:center;
    width:100%;height:2.5rem;
    border-radius:1.25rem;background:rgba(255,255,255,.8);
    padding:0 .75rem;overflow:hidden;box-sizing:border-box;
  }
  .top-nav .roll-news .horn{width:1.4375rem;height:1.4375rem;flex:0 0 1.4375rem;color:#840911;margin-right:.5rem;}
  .top-nav .roll-news .roll{flex:1;height:2.5rem;overflow:hidden;position:relative;min-width:0;}
  .top-nav .roll-news .roll-inner{transition:transform .5s ease;width:100%;}
  .top-nav .roll-news .roll-item{height:2.5rem;line-height:2.5rem;font-size:.8125rem;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;display:block;}

  .backlog{margin-top:1.5625rem;display:flex;justify-content:space-around;}
  .backlog .b-item{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;}
  .backlog-img{height:1.875rem;width:1.875rem;object-fit:contain;display:block;margin-bottom:.3125rem;}
  .backlog-text{margin-top:.3125rem;font-weight:500;color:#ab425c;font-size:.75rem;line-height:normal;}

  .scroll-zehngti{position:relative;}
  .often-nav{
    margin-top:1.09375rem;background-color:#fff;border-radius:1.5625rem;
    display:flex;align-items:center;padding-left:1.25rem;
    background:rgba(255,255,255,.9);
  }
  .often-scroll-view{display:flex;margin:.9375rem 0;white-space:nowrap;overflow-x:auto;width:100%;box-sizing:border-box;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .often-scroll-view::-webkit-scrollbar{display:none;}
  .often-scroll-view-const{display:inline-block;}
  .often-scroll-view-itme{
    margin-left:1.25rem;width:3.125rem;min-width:3.125rem;min-height:5.9375rem;padding:0;
    display:flex;justify-content:center;align-items:center;flex-direction:column;
  }
  .often-scroll-view-img{width:1.5625rem;height:1.5625rem;margin-bottom:.625rem;object-fit:contain;display:block;}
  .often-scroll-view-itme-p{white-space:nowrap;width:3.125rem;min-width:3.125rem;min-height:1.25rem;font-size:.75rem;text-align:center;line-height:normal;color:#000;margin:0;}
  .scrllbar{height:.625rem;width:4.375rem;position:absolute;top:87%;left:40%;border-radius:.625rem;background:rgba(164,18,28,.1);}
  .scrllbar-background{border-radius:.625rem;height:.625rem;width:4.375rem;background:rgba(164,18,28,.9);transition:transform .1s ease-in-out;}

  .often-nav-zhan{
    margin-top:1.09375rem;background-color:#fff;border-radius:1.5625rem;
    display:flex;align-items:center;background:rgba(255,255,255,.9);
  }
  .query-left{height:10.3125rem;width:33.33%;margin:.9375rem;border-radius:.9375rem;background-color:#fff2e7;position:relative;overflow:hidden;}
  .query-left-h5{color:#e36729;position:absolute;top:.625rem;left:1.40625rem;font-weight:700;font-size:1rem;}
  .query-left-text{color:#e36729;position:absolute;top:2.1875rem;left:1.5625rem;font-size:.75rem;border:1px solid #efa66b;border-radius:.9375rem;padding:.03125rem .3125rem .15625rem;}
  .query-left img{width:6.25rem;height:5rem;position:absolute;bottom:0;right:0;}
  .query-right{width:53%;}
  .query-right-top{height:4.6875rem;margin-bottom:.78125rem;background-color:rgba(185,234,234,.8);border-radius:.9375rem;position:relative;overflow:hidden;transition:transform .5s;}
  .query-right-top.enlarged{transform:scale(1.1);}
  .query-right-top-h5{position:absolute;top:1.5625rem;left:1.5625rem;color:#5bb5c2;font-weight:700;font-size:.9375rem;}
  .query-right-top img{position:absolute;width:3.75rem;height:3.125rem;bottom:0;right:0;}
  .query-right-bottom{height:4.6875rem;width:50%;border-radius:.9375rem;background-color:#edfff4;position:relative;overflow:hidden;transition:transform .5s;}
  .query-right-bottom-h5{position:absolute;color:#09887c;left:.78125rem;top:.78125rem;font-weight:700;font-size:.8125rem;}
  .query-right-bottom img{position:absolute;width:3.75rem;height:2.5rem;bottom:0;right:0;}

  /* ========== 应用页 ========== */
  .app-section{margin:.96rem;background:rgba(255,255,255,.92);border-radius:12px;padding:14px 7px 18px;}
  .app-section .sec-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:4px 10px 12px;border-bottom:1px solid rgba(164,18,28,.18);margin-bottom:10px;
  }
  .app-section .sec-head .ht{display:flex;align-items:center;font-size:18px;font-weight:700;}
  .app-section .sec-head .ht svg{width:22px;height:22px;margin-right:8px;color:var(--primary);}
  .app-section .sec-head .help{font-size:14px;color:#1c6fd8;}
  .app-grid{display:flex;flex-wrap:wrap;}
  /* 与真实站 tui-grid 单元一致：85.8x82.2，图标 26，标签 12.48 纯黑 */
  .app-grid .a-item{width:25%;height:4.94rem;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:.9rem 0 0;box-sizing:border-box;}
  .app-grid .a-item svg,.app-grid .a-item img.ic{width:1.5625rem;height:1.5625rem;flex:0 0 auto;object-fit:contain;}
  .app-grid .a-item span{font-size:.75rem;line-height:normal;margin-top:.3rem;color:#000;white-space:nowrap;}

  /* ========== 资讯页 ========== */
  .news-wrap{padding:0 14px;}
  .news-card{margin-top:14px;background:rgba(255,255,255,.92);border-radius:14px;padding:16px;}
  .news-card .nc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .news-card .nc-head .t{font-size:14px;color:#555;}
  .news-card .nc-head .more{font-size:13px;color:#1c6fd8;}
  .news-item{display:flex;align-items:center;padding:10px 0;}
  .news-item .ni-icon{width:40px;height:40px;flex:0 0 40px;color:var(--blue);margin-right:12px;}
  .news-item .ni-body .ni-title{font-size:15px;font-weight:600;margin-bottom:6px;}
  .news-item .ni-body .ni-desc{font-size:13px;color:#888;}

  /* ========== 我的 ========== */
  .mine-wrap{padding:0 14px;}
  .mine-profile{
    margin-top:40px;background:rgba(255,255,255,.95);border-radius:12px;
    padding:52px 20px 20px;position:relative;min-height:120px;
  }
  .mine-avatar{
    position:absolute;top:-36px;left:28px;width:86px;height:86px;border-radius:50%;
    border:3px solid #fff;overflow:hidden;background:#eef1f5;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  .mine-avatar img{width:100%;height:100%;object-fit:cover;}
  .mine-avatar svg{width:100%;height:100%;}
  .mine-info{padding-left:2px;}
  .mine-info .m-name{font-size:19px;font-weight:600;color:#222;}
  .mine-info .m-phone{font-size:13px;color:#999;margin-top:6px;}
  .mine-profile .edit-btn{
    position:absolute;right:18px;top:24px;
    border:1px solid var(--primary);color:var(--primary);
    font-size:14px;border-radius:8px;padding:6px 14px;background:transparent;
  }
  .mine-help{margin-top:20px;background:rgba(255,255,255,.92);border-radius:10px;padding:16px 6px;}
  .mine-help .mh-head{display:flex;align-items:center;font-size:17px;font-weight:700;padding:0 10px 14px;border-bottom:1px solid rgba(164,18,28,.18);}
  .mine-help .mh-head svg{width:22px;height:22px;margin-right:8px;color:var(--primary);}
  .mine-help-grid{display:flex;}
  .mine-help-grid .h-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:14px 0;}
  .mine-help-grid .h-item svg{width:30px;height:30px;}
  .mine-help-grid .h-item img.ic{width:30px;height:30px;object-fit:contain;}
  .mine-help-grid .h-item span{font-size:12px;margin-top:8px;text-align:center;}
  .login-btn{
    margin:26px 14px 0;display:block;width:calc(100% - 28px);
    height:48px;border:none;border-radius:26px;
    background:var(--primary);color:#fff;font-size:17px;font-weight:600;
  }

  /* ========== 底部 tabbar（凸起） ========== */
  #tabbar{
    position:absolute;left:0;right:0;bottom:0;height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:#fff;display:flex;z-index:50;
  }
  #tabbar .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;position:relative;color:#999;
  }
  #tabbar .tab svg{width:24px;height:24px;}
  #tabbar .tab span{font-size:11px;}
  #tabbar .tab.active{color:var(--primary);}
  #tabbar .tab.active .tab-circle{
    position:absolute;top:-20px;width:46px;height:46px;border-radius:50%;
    background:var(--primary);border:4px solid #fff;
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  #tabbar .tab.active .tab-circle svg{width:22px;height:22px;color:#fff;}
  #tabbar .tab.active .tab-icon{opacity:0;}
  #tabbar .tab .tab-circle{display:none;}

  /* ========== 全屏子页面 ========== */
  .sub-page{
    position:absolute;top:0;left:0;right:0;bottom:0;z-index:100;
    background:#f5f5f7;display:flex;flex-direction:column;
    animation:slideIn .25s ease;
  }
  @keyframes slideIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
  .sub-nav{
    height:50px;flex:0 0 50px;display:flex;align-items:center;position:relative;
    background:var(--primary);color:#fff;
    padding-top:env(safe-area-inset-top);
  }
  .sub-nav .back{width:46px;height:50px;display:flex;align-items:center;justify-content:center;}
  .sub-nav .back svg{width:24px;height:24px;}
  .sub-nav .nav-title{position:absolute;left:50%;transform:translateX(-50%);font-size:17px;font-weight:600;}
  .sub-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}

  /* 表单 */
  .form-card{background:#fff;margin:10px;border-radius:10px;overflow:hidden;}
  .form-row{display:flex;align-items:center;padding:14px 14px;border-bottom:1px solid #f0f0f0;min-height:52px;}
  .form-row:last-child{border-bottom:none;}
  .form-row .label{width:92px;flex:0 0 92px;font-size:15px;color:#333;}
  .form-row .label .req{color:var(--primary);margin-right:3px;}
  .form-row input,.form-row textarea,.form-row select{
    flex:1;border:none;outline:none;font-size:15px;background:transparent;color:#333;width:100%;
    font-family:inherit;
  }
  .form-row textarea{resize:none;min-height:74px;line-height:1.5;}
  .form-row .arrow{color:#ccc;}
  .form-row .val{flex:1;font-size:15px;color:#333;}
  .form-row .ph{color:#bbb;}
  .submit-btn{
    margin:22px 14px 30px;width:calc(100% - 28px);height:46px;border:none;border-radius:24px;
    background:var(--primary);color:#fff;font-size:16px;font-weight:600;
  }

  /* 列表 */
  .list-tabs{display:flex;background:#fff;border-bottom:1px solid #eee;}
  .list-tabs .lt{flex:1;text-align:center;padding:14px 0;font-size:15px;color:#333;position:relative;}
  .list-tabs .lt.on{color:#000;font-weight:600;}
  .list-tabs .lt.on::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:28px;height:3px;border-radius:2px;background:#a4121c;}
  .task-card{background:#fff;margin:10px;border-radius:10px;padding:14px;}
  .task-card .tc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .task-card .tc-top .tt{font-size:16px;font-weight:600;}
  .tag{font-size:11px;padding:2px 8px;border-radius:4px;}
  .tag.red{background:#fdeaea;color:#e53935;}
  .tag.orange{background:#fff3e0;color:#fb8c00;}
  .tag.blue{background:#e8f0fe;color:#2f6fe0;}
  .tag.green{background:#e6f7ec;color:#1a9e54;}
  .tag.gray{background:#f0f0f0;color:#888;}
  .task-card .tc-line{font-size:13px;color:#777;margin-top:6px;}
  .task-card .tc-line b{color:#444;font-weight:500;}

  .empty{display:flex;flex-direction:column;align-items:center;padding:70px 0;color:#bbb;}
  .empty svg{width:70px;height:70px;margin-bottom:14px;}
  .empty p{font-size:14px;}

  /* 课程表 */
  .schedule{background:#fff;margin:10px;border-radius:10px;overflow:hidden;}
  .schedule .sch-head{display:flex;background:var(--primary);color:#fff;font-size:12px;}
  .schedule .sch-head div{flex:1;text-align:center;padding:10px 2px;}
  .schedule .sch-head .time-col{flex:0 0 38px;}
  .schedule .sch-row{display:flex;border-bottom:1px solid #f0f0f0;min-height:58px;}
  .schedule .sch-row .time-col{flex:0 0 38px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#999;background:#fafafa;}
  .schedule .sch-row .cell{flex:1;border-left:1px solid #f0f0f0;padding:3px;}
  .course{font-size:10px;border-radius:4px;padding:4px 3px;color:#fff;line-height:1.3;margin-bottom:2px;word-break:break-all;}

  /* 成绩 */
  .grade-card{background:#fff;margin:10px;border-radius:10px;padding:14px;}
  .grade-card .gc-name{font-size:15px;font-weight:600;margin-bottom:10px;}
  .grade-card .gc-grid{display:flex;flex-wrap:wrap;}
  .grade-card .gc-grid .g{width:33.33%;text-align:center;margin-bottom:10px;}
  .grade-card .gc-grid .g .num{font-size:18px;font-weight:700;color:var(--primary);}
  .grade-card .gc-grid .g .lab{font-size:12px;color:#999;margin-top:3px;}

  /* 统一身份认证 移动端登录页（仿真实） */
  .sso-page{background:#fff;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;}
  .sso-bg{position:absolute;left:0;right:0;bottom:0;height:62%;background-image:url("../assets/banner2.png");background-size:cover;background-position:center;opacity:.16;pointer-events:none;filter:grayscale(.2);}
  .sso-content{position:relative;z-index:1;padding:34px 34px 0;display:flex;flex-direction:column;align-items:center;flex:1;}
  .sso-logo{width:118px;height:118px;}
  .sso-tab{margin-top:26px;font-size:22px;font-weight:700;color:#881631;letter-spacing:2px;position:relative;padding-bottom:10px;}
  .sso-tab::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:44px;height:4px;border-radius:2px;background:#881631;}
  .sso-form{width:100%;margin-top:26px;}
  .sso-field{display:flex;align-items:center;border-bottom:1px solid #e2e2e2;margin-bottom:8px;}
  .sso-field .s-ico{width:26px;height:26px;color:#b5b5b5;margin-right:12px;flex:0 0 26px;}
  .sso-field input{flex:1;border:none;outline:none;height:52px;font-size:16px;background:transparent;color:#333;}
  .sso-field input::placeholder{color:#b5b5b5;}
  .sso-field:focus-within{border-bottom:1.5px solid #2196f3;}
  .sso-remember{display:flex;align-items:center;width:100%;margin-top:14px;font-size:15px;color:#333;}
  .sso-remember .cb{width:20px;height:20px;background:#fff;border:1.5px solid #999;border-radius:5px;margin-right:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;}
  .sso-remember.on .cb{background:#881631;border-color:#881631;}
  .sso-remember .q{width:18px;height:18px;border-radius:50%;background:#bbb;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;margin-left:8px;}
  .sso-login{width:100%;height:52px;border:none;border-radius:8px;background:#861932;color:#fff;font-size:18px;font-weight:600;margin-top:26px;}
  .sso-wx{display:flex;flex-direction:column;align-items:center;margin-top:30px;position:relative;z-index:1;padding-bottom:20px;}
  .sso-wx .wxb{width:64px;height:64px;border-radius:50%;background:#07c160;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(7,193,96,.4);}
  .sso-wx .wxb svg{width:40px;height:40px;color:#fff;}
  .sso-wx span{font-size:14px;color:#666;margin-top:8px;}

  /* 请假详情（仿真实） */
  .ld-top{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:20px 16px;border-bottom:1px solid #f0f0f0;}
  .ld-top .who{color:#999;font-size:17px;}
  .ld-top .who b{color:#888;font-weight:500;}

(function(){
  function kill(){
    try{
      document.querySelectorAll('iframe[id*="open-sandbox"],iframe[id^="sb__"],[id*="open-sandbox"]')

  }
})();

/* ===================== 工具函数 ===================== */
const $ = (s,el=document)=>el.querySelector(s);
const GLOBAL_KEYS={user:1,news:1};
function curUser(){ try{const v=localStorage.getItem('user');return v?JSON.parse(v):null;}catch(e){return null;} }
const store = {
  // 每个账号的数据独立：非全局键自动加 u_<账号>_ 前缀
  key(k){ if(GLOBAL_KEYS[k])return k; const u=curUser(); return u&&u.username?('u_'+u.username+'_'+k):k; },
  get(k,d){ try{const v=localStorage.getItem(this.key(k));return v?JSON.parse(v):d;}catch(e){return d;} },
  set(k,v){
    try{
      localStorage.setItem(this.key(k),JSON.stringify(v));
      if(k==='user'&&v&&v.username){ localStorage.setItem('prof_'+v.username,JSON.stringify(v)); }
    }catch(e){}
  },
  del(k){ localStorage.removeItem(this.key(k)); },
  rawGet(k,d){ try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;} }
};
let toastTimer;
function toast(msg,ms=1800){
  const t=$('#toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.display='none',ms);
}
function dialog(title,msg,{okText='确定',cancelText='取消'}={}){
  return new Promise(res=>{
    const mask=document.createElement('div');
    mask.className='mask';
    mask.innerHTML=`<div class="dialog"><div class="d-title">${title}</div><div class="d-msg">${msg}</div>
      <div class="d-btns"><button id="dCancel">${cancelText}</button><button class="primary" id="dOk">${okText}</button></div></div>`;
    $('#phone').appendChild(mask);
    mask.querySelector('#dCancel').onclick=()=>{mask.remove();res(false);};
    mask.querySelector('#dOk').onclick=()=>{mask.remove();res(true);};
  });
}
function isLogin(){ return !!store.get('user',null); }
function user(){ return store.get('user',null); }
// 未登录时也能显示姓名的兜底
function displayName(){
  var x=user();
  if(x&&x.name) return x.name;
  try{ if(typeof REAL!=='undefined'&&REAL.name) return REAL.name; }catch(e){}
  return '学生';
}

/* ===================== 路由 ===================== */
const TABS=[
  {key:'home',label:'首页',icon:I.home},
  {key:'apps',label:'应用',icon:I.apps},
  {key:'news',label:'资讯',icon:I.news},
  {key:'mine',label:'我的',icon:I.mine},
];
let currentTab='home';

function renderTabbar(){
  const tb=$('#tabbar');
  tb.innerHTML=TABS.map(t=>`
    <div class="tab ${currentTab===t.key?'active':''}" data-tab="${t.key}">
      <span class="tab-icon">${t.icon}</span>
      <span class="tab-circle">${t.icon}</span>
      <span>${t.label}</span>
    </div>`).join('');
  tb.querySelectorAll('.tab').forEach(el=>{
    el.onclick=()=>{ switchTab(el.dataset.tab); };
  });
}
function switchTab(key){
  currentTab=key;
  closeSub();
  renderTabbar();
  renderPage();
  $('#viewport').scrollTop=0;
}
function renderPage(){
  const page=$('#page');
  page.classList.remove('pad0');
  const map={home:rHome,apps:rApps,news:rNews,mine:rMine};
  page.innerHTML=map[currentTab]();
  if(currentTab==='home') bindHome();
  if(currentTab==='apps') bindApps();
  if(currentTab==='news') bindNews();
  if(currentTab==='mine') bindMine();
}

function openSub(html){
  $('#sub').innerHTML=html;

function closeSub(){
  $('#sub').innerHTML='';
  $('#viewport').style.bottom='';
}
function subShell(title,body,navRight=''){

}

let bannerIdx=0,rollIdx=0,bannerTimer,rollTimer;
function bindHome(){
  // 轮播（scroll-snap 横滑，自动轮播）
  const strip=$('#bannerSlides');
  clearInterval(bannerTimer);
  if(strip){
    const slideW=()=>strip.clientWidth||1;
    bannerTimer=setInterval(()=>{
      bannerIdx=(bannerIdx+1)%2;
      strip.scrollTo({left:bannerIdx*slideW(),behavior:'smooth'});
    },3000);
    strip.addEventListener('scroll',()=>{
      bannerIdx=Math.round(strip.scrollLeft/slideW())%2;
    },{passive:true});
  }
  // 公告垂直滚动
  const inner=$('#rollInner');
  clearInterval(rollTimer);
  rollTimer=setInterval(()=>{
    rollIdx=(rollIdx+1)%3;
    inner.style.transform=`translateY(-${rollIdx*40}px)`;
  },2600);
  // 待办
  document.querySelectorAll('.backlog .b-item').forEach(el=>{
    el.onclick=()=>{ const i=el.dataset.go; requireLogin(()=>openTaskList(+i)); };
  });
  // 常用功能
  document.querySelectorAll('.often-scroll-view-itme').forEach(el=>{
    el.onclick=()=>{
      const k=el.dataset.go;
      const map={
        dianbiao:()=>toast('正在跳转电表缴费…'),
        yikatong:()=>toast('正在跳转一卡通充值…'),
        qingjia:()=>requireLogin(()=>openLeaveList()),
        xueji:()=>requireLogin(()=>openChange()),
      };
      (map[k]||(()=>{}))();
    };
  });

function stKey(s){
  if(!s) return 'ing';
  if(/通过|同意|完成|结束/.test(s)) return 'pass';
  if(/驳回|不通过|退回|拒绝/.test(s)) return 'reject';
  if(/待|流程中|审批中/.test(s)) return 'ing';
  return 'ing';
}

/* 隐私字段保护：源码只存数字密文，运行时解出原文（页面显示完全不变） */
function D(s){
  var K=[176,23,62,50,66,149,227,186,110,99,106,14,199,73,199,199,97,113,133,19,201,74,139,151,40,70,24,231,118,131,37,170];
  var bytes=[],i,txt='';
  for(i=0;i+3<=s.length;i+=3){ bytes.push(parseInt(s.substr(i,3),10)); }
  for(i=0;i<bytes.length;i++){ txt+=String.fromCharCode(bytes[i]^K[i%K.length]); }
  try{ return decodeURIComponent(escape(txt)); }catch(e){ return txt; }
}

// 请假天数：按起止时间算，保留 1 位小数
function calcDays(s,e){
  const a=new Date(s), b=new Date(e);
  if(isNaN(a)||isNaN(b)||b<=a) return 1;
  return Math.max(0.5, Math.round((b-a)/86400000*10)/10);
}
function genFlowNo(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}${String(Math.floor(Math.random()*9000+1000))}`;
}

    if(new Date(end)<=new Date(start)){ toast('结束时间需晚于开始时间'); return; }
    if(!phone){ toast('请输入电话'); return; }
    if(!code){ toast('请输入验证码'); return; }
    if(!reason){ toast('请输入请假原因'); return; }
    const leaves=store.get('leaves',defaultLeaves());
    if(edit){
      const idx=leaves.findIndex(x=>x.id===edit.id);

        leaves[idx]=Object.assign({},leaves[idx],{flow,type,start,end,time:`${fmt(start)}~${fmt(end)}`,phone,reason,attachCnt:cnt});

      toast('提交成功');
    }
    store.set('leaves',leaves);
    store.set('user',Object.assign({},u,{phone}));
    setTimeout(()=>openLeaveList(),700);
  };
}

/* ===================== 页面切换加载延迟 ===================== */
const PAGE_DELAY=500;                 // 普通页面 0.5 秒
const LEAVE_DELAY=1500;               // 请假相关页面 1.5 秒
const LEAVE_FNS=['openLeaveList','openLeaveForm','openLeaveDetail'];
let pageTimer=0;
function showLoading(){ const el=$('#loading'); if(el) el.classList.add('on'); }
function hideLoading(){ const el=$('#loading'); if(el) el.classList.remove('on'); }
(function(){
  const names=['switchTab','openLogin','openTaskList','openLeaveList','openLeaveDetail','openLeaveForm',
    'openRepair','openRepairDetail','openRepairForm','openSure','openPhoneBook','openCalendar','openSchedule',
    'openScore','openEditInfo','openChangePwd','openNewsDetail','openClub','openChange','openHelp','openAvatar'];
  names.forEach(n=>{
    const orig=window[n];
    if(typeof orig!=='function') return;
    const wait=LEAVE_FNS.indexOf(n)>=0?LEAVE_DELAY:PAGE_DELAY;
    window[n]=function(){
      const self=this, args=arguments;
      showLoading();
      clearTimeout(pageTimer);
      pageTimer=setTimeout(()=>{ hideLoading(); orig.apply(self,args); },wait);
    };
  });
})();

// 根字号：与真实站一致（uni-app 规则 1rem = min(视口宽,800)/375 * 16）
(function(){
  function setRoot(){
    var w=window.innerWidth||375;
    var base=Math.min(w,800);
    document.documentElement.style.fontSize=(base/375*16)+'px';
  }
  setRoot();
  window.addEventListener('resize',setRoot);
  window.addEventListener('orientationchange',function(){setTimeout(setRoot,300);});
})();
// iOS Safari 地址栏动态高度修正（1vh 会含地址栏，用 --vh 精确算）
(function(){
  function setVH(){
    const h=(window.visualViewport?window.visualViewport.height:window.innerHeight)||window.innerHeight;
    document.documentElement.style.setProperty('--vh',(h/100)+'px');
  }
  setVH();
  window.addEventListener('resize',setVH);
  window.addEventListener('orientationchange',()=>setTimeout(setVH,300));
  if(window.visualViewport) window.visualViewport.addEventListener('resize',setVH);
})();

// iOS 键盘弹出后把当前输入框滚进可见区域（否则下方字段被键盘挡住）
(function(){
  function scrollParent(el){
    let p=el.parentElement;
    while(p && p!==document.body){
      const st=getComputedStyle(p);
      if(/(auto|scroll)/.test(st.overflowY) && p.scrollHeight>p.clientHeight+2) return p;
      p=p.parentElement;
    }
    return null;
  }
  function reveal(){
    const el=document.activeElement;
    if(!el||!/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    const vv=window.visualViewport;
    const visTop=vv?vv.offsetTop:0;
    const visBottom=vv?(vv.offsetTop+vv.height):window.innerHeight;
    const pad=14;
    let er=el.getBoundingClientRect();
    const sc=scrollParent(el);
    if(!sc){
      if(er.bottom>visBottom-pad) window.scrollBy(0,er.bottom-visBottom+pad+8);
      return;
    }
    const sr=sc.getBoundingClientRect();
    const bottomLimit=Math.min(sr.bottom,visBottom-pad);
    if(er.bottom>bottomLimit) sc.scrollTop += (er.bottom-bottomLimit)+8;
    er=el.getBoundingClientRect();
    const topLimit=Math.max(sr.top,visTop)+pad;
    if(er.top<topLimit) sc.scrollTop -= (topLimit-er.top);
  }
  const isField=t=>t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
  document.addEventListener('focusin',e=>{
    if(!isField(e.target)) return;
    setTimeout(reveal,120);
    setTimeout(reveal,420);
    setTimeout(reveal,800);
  });
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',()=>{
      setTimeout(reveal,80);
      setTimeout(reveal,300);
    });
  }
})();
renderTabbar();
renderPage();

</script>
</body>
</html>
